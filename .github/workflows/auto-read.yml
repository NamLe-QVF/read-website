name: Auto Read Website

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run start
        env:
          TARGET_SITE_URL: ${{ vars.TARGET_SITE_URL }}
          ARTICLE_URL_PATTERN: ${{ vars.ARTICLE_URL_PATTERN }}
          READ_DURATION_SECONDS: '60'
          MAX_ARTICLES_PER_RUN: '75'

      - name: Commit updated state
        run: |
          git config user.name "auto-read-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update read state"
          git push
