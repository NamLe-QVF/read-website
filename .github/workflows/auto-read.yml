name: Auto Read Website

on:
  workflow_dispatch: {}

concurrency:
  group: auto-read-single-run
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run start
        env:
          TARGET_SITE_URL: ${{ vars.TARGET_SITE_URL }}
          ARTICLE_URL_PATTERN: ${{ vars.ARTICLE_URL_PATTERN }}
          READ_DURATION_SECONDS: '300'
          TICK_INTERVAL_MINUTES: '10'
          TIMEZONE: 'Asia/Ho_Chi_Minh'
          ACTIVE_START_HOUR: '7'
          ACTIVE_END_HOUR: '23'

      - name: Commit updated state
        run: |
          git config user.name "auto-read-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update read state"
          git pull --rebase origin main
          git push
